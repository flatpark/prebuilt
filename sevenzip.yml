# 7-Zip's 7zr, prebuilt for FlatPark apps.
#
# A standalone extractor, not a library. Apps that download .7z archives at run
# time — model files, OCR data, tool bundles that upstream only publishes in that
# format — need something that can unpack them, and neither runtime ships a 7z
# implementation. `7zr` is upstream's reduced build: the .7z format only, no
# zip/rar/tar handlers, no GUI, one binary with no dependencies beyond libc.
#
# The archive therefore ships a single file, bin/7zr. A consuming app puts that
# bin/ on PATH.
id: org.flatpark.Prebuilt.Sevenzip
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: /usr/bin/true
build-options:
  # no-debuginfo suppresses the .Debug extension but does NOT strip: on its own
  # it leaves full DWARF inside the binary. Strip explicitly. A consumer that
  # needs symbols rebuilds from this manifest at its release tag.
  no-debuginfo: true
  strip: true

modules:
  - name: sevenzip
    buildsystem: simple
    build-commands:
      # Upstream ships plain makefiles, no configure and no install target.
      - make -C CPP/7zip/Bundles/Alone7z -f makefile.gcc -j$FLATPAK_BUILDER_N_JOBS
      - install -Dm755 CPP/7zip/Bundles/Alone7z/_o/7zr /app/bin/7zr
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/releases/download/25.01/7z2501-src.tar.xz
        sha256: ed087f83ee789c1ea5f39c464c55a5c9d4008deb0efe900814f2df262b82c36e
        # The tarball has no top-level directory to strip.
        strip-components: 0
