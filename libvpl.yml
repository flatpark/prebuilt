# Intel VPL dispatcher, prebuilt for FlatPark apps.
#
# libvpl is the dispatcher half of Intel's Video Processing Library: it is what
# ffmpeg's `--enable-libvpl` links, and at run time it loads whatever Intel media
# driver the host provides (or finds none and the QSV encoders simply do not
# appear). The driver itself is never shipped here — only the dispatcher, which
# is the part that has to be present at link time.
#
# CAVEAT, read before pinning this: the dispatcher ALONE cannot encode. It
# enumerates oneVPL implementations at run time and the one that does the work,
# `libmfx-gen.so`, ships with Intel's media driver — which no Flatpak extension
# provides. Measured inside a sandbox on an Intel Arc 140V with --device=dri,
# the hardware QSV exists for: `h264_qsv` fails with "Error creating a MFX
# session: -9", while `h264_vaapi` encodes successfully through the same
# /dev/dri/renderD128. So an ffmpeg built --enable-libvpl offers QSV encoders
# that can never run in a Flatpak; ffmpeg-full.yml deliberately does not enable
# it. This release exists for a consumer that has its own way to supply the
# runtime. VAAPI is the path Intel and AMD GPUs actually take here.
#
# Dev-complete (library + headers + pkg-config) so a consumer can build against
# it. Tests, examples and the example source install are all off: nothing
# downstream links them.
id: org.flatpark.Prebuilt.Libvpl
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: /usr/bin/true
build-options:
  # no-debuginfo suppresses the .Debug extension but does NOT strip: on its own
  # it leaves full DWARF inside every library in the archive. Strip explicitly.
  # A consumer that needs symbols rebuilds from this manifest at its release tag.
  no-debuginfo: true
  strip: true
cleanup:
  - "*.a"
  - /share
  # An env-setup script for a non-Flatpak install layout; nothing sources it here.
  - /etc

modules:
  - name: libvpl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DINSTALL_EXAMPLE_CODE=OFF
    sources:
      - type: git
        url: https://github.com/intel/libvpl.git
        tag: v2.15.0
        commit: c45b5d786bf7cdabbe49ff1bab78693ad78feb78
