# Poppler with its GLib binding, prebuilt for FlatPark apps.
#
# Why this exists: org.gnome.Platform//51 ships the cairo, freetype, lcms2,
# openjpeg, libjpeg, libtiff and libpng that Poppler renders with, but not
# Poppler itself. A payload linking libpoppler-glib.so.8 cannot start without it.
#
# First consumer: io.github.lgse.Strata (a GTK 4 file manager whose PDF preview
# links poppler-glib directly).
#
# Runtime-only and deliberately narrow: libpoppler + libpoppler-glib, nothing
# else. Every optional backend that would drag a library the runtime lacks or
# that a PDF *renderer* has no use for is off:
#
#   - libcurl (remote PDF streaming), gpgme / NSS (signature verification): a
#     distribution build links libcurl-gnutls and libgpgmepp.so.6, which pull
#     librtmp, libssh2, nettle 8, libldap and libgpgme in turn - roughly ten
#     extra libraries for features a preview never touches.
#   - Qt5/Qt6/C++ bindings, the pdfto* utilities, GObject introspection and the
#     test programs.
#
# soname check: libpoppler-glib.so.8 has been stable for years; libpoppler.so.N
# changes with nearly every Poppler release, but consumers only link the GLib
# binding, so bumping Poppler here needs no change on their side.
id: org.flatpark.Prebuilt.PopplerGlib
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: /usr/bin/true
build-options:
  # no-debuginfo suppresses the .Debug extension but does NOT strip: on its own
  # it leaves full DWARF inside every library in the archive. Strip explicitly.
  # A consumer that needs symbols rebuilds from this manifest at its release tag.
  no-debuginfo: true
  strip: true
cleanup:
  - "*.a"
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share

modules:
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_UNSTABLE_API_ABI_HEADERS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_NSS3=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35
